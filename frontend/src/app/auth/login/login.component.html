<div class="container mt-5">
  <div class="card p-4 mx-auto shadow" style="max-width: 400px; border-radius: 12px;">
    <h4 class="text-center mb-4 fw-bold">Login</h4>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" placeholder="Enter your email" />
        <small class="text-danger" *ngIf="f.email.touched && f.email.errors?.['required']">Email is required</small>
        <small class="text-danger" *ngIf="f.email.touched && f.email.errors?.['email']">
          Please enter a valid email
        </small>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password" placeholder="Enter password" />
        <small class="text-danger" *ngIf="f.password.touched && f.password.errors?.['required']">
          Password is required
        </small>
        <small class="text-danger" *ngIf="f.password.touched && f.password.errors?.['minlength']">
          Password must be at least 6 characters
        </small>
      </div>

      <div class="text-danger mt-2" *ngIf="message">{{ message }}</div>

      <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="loading || loginForm.invalid">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="text-center mt-3">
      <a routerLink="/signup" class="text-decoration-none">Don’t have an account? Sign Up</a>
    </div>
  </div>
</div>
