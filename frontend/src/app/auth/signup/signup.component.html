<div class="container mt-5">
  <div class="card p-4 mx-auto shadow" style="max-width: 400px; border-radius: 12px;">
    <h4 class="text-center mb-4 fw-bold">Sign Up</h4>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <!-- Name -->
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" formControlName="name" placeholder="Enter your name" />
        <small class="text-danger" *ngIf="f.name.touched && f.name.errors?.['required']">Name is required</small>
        <small class="text-danger" *ngIf="f.name.touched && f.name.errors?.['minlength']">
          Name must be at least 2 characters
        </small>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" placeholder="Enter your email" />
        <small class="text-danger" *ngIf="f.email.touched && f.email.errors?.['required']">Email is required</small>
        <small class="text-danger" *ngIf="f.email.touched && f.email.errors?.['email']">
          Please enter a valid email
        </small>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password" placeholder="Enter password" />
        <small class="text-danger" *ngIf="f.password.touched && f.password.errors?.['required']">
          Password is required
        </small>
        <small class="text-danger" *ngIf="f.password.touched && f.password.errors?.['minlength']">
          Password must be at least 6 characters
        </small>
      </div>

      <div class="text-success mt-2" *ngIf="message">{{ message }}</div>

      <button type="submit" class="btn btn-success w-100 mt-3" [disabled]="loading || signupForm.invalid">
        {{ loading ? 'Signing up...' : 'Sign Up' }}
      </button>
    </form>

    <div class="text-center mt-3">
      <a routerLink="/login" class="text-decoration-none">Already have an account? Login</a>
    </div>
  </div>
</div>
